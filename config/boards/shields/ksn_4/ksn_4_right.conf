CONFIG_NFCT_PINS_AS_GPIOS=y
# central 역할을 왼쪽에서 이전받음: row6의 마지막 4개 컬럼(RCTRL/LEFT/DOWN/RIGHT)이
# 매트릭스 포지션 128~131번이라 ZMK split BLE의 POS_STATE_LEN(16바이트=128비트)
# 하드코딩 한계를 넘어 peripheral -> central 전달이 불가능했음.
# central 자신의 로컬 키 입력은 이 BLE 전달 과정을 거치지 않으므로, 오른쪽을
# central로 바꿔서 회피함.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# DEBUG: col7-10(RCTRL/LEFT/DOWN/RIGHT) 미동작 원인 확인용
# USB 로깅 활성화 + ZMK_LOG_LEVEL=DBG 는 build.yaml 의 zmk-usb-logging snippet 이 자동으로 처리함
# (ZMK 공식 문서: https://zmk.dev/docs/development/usb-logging)
# CONFIG_LOG_DEFAULT_LEVEL 은 절대 여기서 수동 설정하지 말 것:
#   Zephyr 전역 기본 로그레벨이라 USB 드라이버(nrf_usbd_common) 등
#   무관한 저수준 모듈까지 DEBUG로 켜져서 로그 버퍼가 넘쳐(messages dropped)
#   정작 필요한 로그가 유실됨

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_BATTERY_REPORTING=y
# central(오른쪽)이 peripheral(왼쪽)의 배터리 잔량도 주기적으로 가져와
# 호스트에 함께 보고하도록 활성화 (기존엔 central 자신의 배터리만 보고됨)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# 왼쪽(peripheral) 캡스락 LED 커스텀 드라이버(ksn1_peripheral_indicators.c)가
# zmk_hid_indicators_changed 이벤트를 받으려면 central(오른쪽)에서 호스트의
# HID indicator 상태를 추적하고 왼쪽으로 전파해야 함
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y
# config/src/ksn1_conn_status_relay_central.c: central이 PC 호스트 연결 여부를
# 왼쪽(peripheral)의 status_led로 전달하기 위한 전용 GATT 서비스 클라이언트.
# ZMK 자체 split 프로토콜이 이미 central 쪽에서 GATT discover/write를 하고
# 있어서 기본으로 켜져 있을 가능성이 높지만, 혹시 몰라 명시적으로 켬.
CONFIG_BT_GATT_CLIENT=y

# CONFIG_BT_MAX_CONN=3 시도했었으나, 매 연결마다 "Security failed ... err 4"
# (AUTH_REQUIREMENT) 무한 반복 루프를 유발하는 것으로 로그에서 확인되어 원복함.
# 슬롯 부족(err 9)보다 훨씬 나쁜 상태였음 - 기본값(2)으로는 적어도 재시도 후
# 연결은 성공했었음. 프로필 전환 시 슬롯 경합 문제는 BT_MAX_CONN을 건드리지
# 않는 다른 방법으로 접근해야 함.
CONFIG_ZMK_RGB_UNDERGLOW=n
# LED 비활성화 요청으로 백라이트 disable 처리
CONFIG_ZMK_BACKLIGHT=n
# CONFIG_PWM=y
# CONFIG_ZMK_BACKLIGHT_ON_START=y
# CONFIG_ZMK_BACKLIGHT_BRT_START=40
# CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y

# "페어링됨"만 뜨고 "연결됨"이 안 되던 문제: kscan0/encoder GPIO가
# 저전력 진입 후 웨이크업 소스로 등록되지 않아 인터럽트를 못 받던 것이 원인.
# 진단 단계에서 CONFIG_PM=n / CONFIG_PM_DEVICE=n으로 PM을 통째로 꺼서 확인했으나,
# 그 상태로는 절전이 전혀 안 되어 배터리 소모가 커지므로 최종 빌드에서는 제거.
# 대신 kscan0(ksn_4.dtsi)와 encoder_right(본 overlay)에 wakeup-source;를
# 추가해 절전은 유지하면서 GPIO 인터럽트로 정상 웨이크업되도록 함.
CONFIG_PM_DEVICE=y

# ============================================================================
# 유선(USB) 연결 시 회사 보안 프로그램 호환성
# ----------------------------------------------------------------------------
# 대상: 키보드 보안 모듈(TouchEn nxKey, AhnLab Online Security, nProtect
# KeyCrypt 등)과 매체제어/DLP 에이전트. 이런 프로그램들은 키보드 HID
# 리포트를 필터 드라이버로 후킹하거나, USB 장치를 VID/PID 화이트리스트로
# 통제함. 표준적이지 않은 HID 디스크립터나 예상 밖의 컴포지트 구성을 만나면
# 입력이 씹히거나 장치가 통째로 차단됨.
#
# 참고: CONFIG_ZMK_USB는 ZMK Kconfig에서 ZMK_SPLIT_ROLE_CENTRAL에 의존하므로
# USB HID 장치로 열거되는 쪽은 오른쪽(central)뿐임. 왼쪽 반은 유선으로 꽂아도
# HID 장치로 안 잡히니 이 설정들은 오른쪽 conf에만 둠.

# 1) 6키 롤오버(HKRO) 고정 - 표준 부트 키보드와 동일한 리포트 구조.
#    NKRO는 리포트 형식이 비표준이라 보안 후킹 드라이버가 키를 놓치는
#    대표적인 원인. 기본값이지만 나중에 실수로 바뀌지 않게 명시함.
CONFIG_ZMK_HID_REPORT_TYPE_HKRO=y
CONFIG_ZMK_HID_KEYBOARD_REPORT_SIZE=6

# 2) USB 부트 프로토콜 지원 - BIOS/UEFI와 부트 프로토콜만 이해하는
#    저수준 필터 드라이버에서도 인식되게 함.
CONFIG_ZMK_USB_BOOT=y

# 3) 컨슈머 리포트를 BASIC(8비트 usage)으로 축소 - 디스크립터가 단순해져
#    후킹 드라이버 호환성이 올라감. 현재 키맵이 쓰는 컨슈머 키
#    (C_VOL_UP/DN, C_MUTE, C_PREV/PP/NEXT, C_BRIGHTNESS_INC/DEC)는 전부
#    0xFF 이하라 BASIC 범위 안에 들어감.
#    주의: 앞으로 C_AL_CALCULATOR(0x192)처럼 0xFF를 넘는 컨슈머 키를 쓰려면
#    이 줄을 지우고 FULL로 되돌려야 함 (KSN-4에는 넘패드가 없어 계산기 키가 없음).
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# 4) 마우스/포인팅 HID 엔드포인트 미사용 (기본값 n, 명시적으로 유지).
#    켜면 HID 디스크립터에 마우스 리포트가 추가되어 컴포지트 성격이 강해짐.
# CONFIG_ZMK_POINTING=n

# 5) USB 장치 식별 정보 - 사내 매체제어 담당자가 화이트리스트에 등록하기
#    쉽도록 제조사/제품 문자열과 VID/PID를 이 키보드 전용 값으로 지정.
#    ZMK 기본값은 VID 0x1D50 / PID 0x615E, 제조사 "ZMK Project"라서
#    모든 ZMK 키보드가 같은 값을 공유함.
#    VID 0x1209는 pid.codes의 오픈소스 공용 VID. PID 0x4B56은 아직
#    pid.codes에 등록되지 않은 임시값이므로, 정식 판매 전에 pid.codes에서
#    PID를 무료로 할당받아 교체할 것.
#    사내 보안 솔루션이 이미 ZMK 기본 VID/PID를 허용하고 있다면 아래
#    VID/PID 두 줄만 지우면 기본값으로 돌아감 (문자열은 남겨도 무방).
#    BLE 장치명은 CONFIG_ZMK_KEYBOARD_NAME("KSN4")을 그대로 쓰므로
#    이 변경으로 블루투스 재페어링이 필요하지는 않음.
#    단, Windows에서는 VID/PID가 바뀌면 새 장치로 재열거됨.
CONFIG_USB_DEVICE_MANUFACTURER="Nexplit"
CONFIG_USB_DEVICE_PRODUCT="Nexplit KSN-4"
CONFIG_USB_DEVICE_VID=0x1209
CONFIG_USB_DEVICE_PID=0x4B56

# 6) CDC-ACM(USB 시리얼) 로깅은 정식 빌드에 절대 넣지 않음.
#    로깅이 켜지면 HID + CDC 컴포지트 장치가 되어 매체제어 프로그램이
#    "알 수 없는 시리얼 장치"로 보고 차단할 수 있음. 로깅이 필요하면
#    build.yaml의 ksn_4_*_debug 아티팩트(zmk-usb-logging snippet)를 따로
#    빌드해서 회사 PC가 아닌 곳에서 사용할 것.
#    (여기서 CONFIG_ZMK_USB_LOGGING=n 으로 명시하지 말 것 - snippet의 conf가
#     나중에 적용되므로 충돌 경고만 생기고 디버그 빌드에서 의도가 꼬임)
# ============================================================================

# TX 파워 상향(기본 0dBm -> +8dBm): central 라디오 하나가 호스트 연결과
# 좌우 스플릿 링크를 동시에 타임슬라이싱하는 구조라 신호 마진이 빠듯함.
# ZMK 공식 저장소의 다른 nRF52840 스플릿 보드(Glove80, Kinesis
# Advantage360 Pro, Polarity Works BT60/65/75)에서 이미 같은 이유로 쓰고
# 있는 값. 트레이드오프는 송신 순간 피크 전류 소폭 증가 정도. (KSN-3에
# 먼저 적용해서 검증한 뒤 KSN-1/2로 이식함)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# BLE 연결 인터벌 최소화(저지연 실험): macOS에서 캡스락 짧게 탭했을 때
# 한/영 입력 소스 전환이 가끔 씹히는 문제 대응. mac_layer의 CLCK 바인딩
# 자체는 default_layer와 완전히 동일(&kp CLCK, 홀드탭/디바운스 설정 없음)
# 이라 펌웨어 로직 문제는 아니고, ZMK/Zephyr 기본 연결 인터벌(30~50ms)이
# BLE HID 리포트 왕복 지연을 키워 macOS 자체의 press/release 타이밍 판별과
# 어긋나는 것으로 추정됨. 스펙상 최소값(6 = 7.5ms)으로 강제하고 슬레이브
# 레이턴시도 0으로 낮춰 매 인터벌마다 응답하도록 해 지연을 최소화함.
# 트레이드오프: 배터리 소모 소폭 증가. 캡스락 전환 실패 빈도가 실제로
# 줄어드는지 확인 후 유지 여부 재검토할 것.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
