CONFIG_NFCT_PINS_AS_GPIOS=y
# central 역할은 오른쪽으로 이전함 (128-포지션 BLE 한계 회피 목적)
# CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_BATTERY_REPORTING=y
# 캡스락 LED: config/src/ksn1_peripheral_indicators.c 커스텀 드라이버가 담당
# (ksn_4_left.overlay 주석 참고). 이 드라이버가 구독하는 zmk_hid_indicators_changed
# 이벤트를 peripheral(왼쪽)에서 받으려면 아래 두 옵션이 필요함.
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y
# LED 서브시스템(led_on/led_off) 활성화. 예전엔 ZMK_INDICATOR_LEDS가 select로
# 자동으로 켜줬지만, 그 노드를 뺐으므로 커스텀 드라이버를 위해 직접 켜야 함.
CONFIG_LED=y
CONFIG_LED_GPIO=y
# 백라이트 LED만 비활성화 요청 - 캡스락/상태 LED는 유지
CONFIG_ZMK_BACKLIGHT=n
# CONFIG_PWM=y
# CONFIG_ZMK_BACKLIGHT_ON_START=y
# CONFIG_ZMK_BACKLIGHT_BRT_START=40
# CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y
# status_led: 예전엔 zmk-poor-mans-led-indicator 모듈의
# CONFIG_INDICATOR_LED_SHOW_PERIPHERAL_BLE로 왼쪽<->오른쪽(peripheral<->central)
# 연결 여부만 표시했음. 이제는 config/src/ksn1_conn_status_relay_peripheral.c가
# 이 LED를 직접 구동해서 central이 PC 호스트에 연결되어 있는지를 표시함
# (연결됨=상시 점등, 연결 안됨=점멸). 그래서 이 모듈은 더 이상 필요 없어
# 비활성화함 - 같은 LED를 두 드라이버가 동시에 건드리면 안 되기 때문.
CONFIG_INDICATOR_LED_WIDGET=n
# CONFIG_INDICATOR_LED_SHOW_BLE=y
# CONFIG_INDICATOR_LED_SHOW_PERIPHERAL_BLE=y
# CONFIG_INDICATOR_LED_SHOW_BATTERY_ON_BOOT=y
# CONFIG_INDICATOR_LED_SHOW_LAYER_CHANGE=n

# TX 파워 상향(기본 0dBm -> +8dBm): central(오른쪽)과 동일 이유로 왼쪽도
# 맞춰줌 - 라디오 설정은 각 하프의 개별 빌드 단위라 양쪽 .conf에 각각
# 넣어야 함. 자세한 근거는 ksn_4_right.conf 주석 참고.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
